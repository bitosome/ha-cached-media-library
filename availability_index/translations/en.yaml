configuration:
  aiostreams_url:
    name: AIOStreams base URL
    description: >-
      Base URL of the AIOStreams instance, for example http://192.168.0.13:3000.
  active_uuid:
    name: Profile UUID
    description: >-
      UUID of the AIOStreams profile to mirror. Read only, to verify that the
      cached-only filter is still enforced.
  active_password:
    name: Profile password
    description: Playback profile configuration password, not dashboard administrator password.
  stremio_uuid:
    name: Stremio endpoint UUID
    description: >-
      Playback profile Stremio UUID. Must match the profile UUID used to read
      the cached-only filter settings.
  stremio_encrypted_password:
    name: Stremio encrypted password
    description: >-
      The profile's encrypted password, the last segment of its Stremio URL.
  catalog_uuid:
    name: Catalogue and metadata source UUID
    description: >-
      Required UUID of a separate profile with the original upstream catalogues
      and metadata providers enabled. Must differ from the playback profile and
      must never include Cached Media Library.
  catalog_encrypted_password:
    name: Source profile encrypted password
    description: Encrypted password of that profile.
  endpoint_token:
    name: Endpoint token
    description: >-
      Private token protecting this app's Stremio endpoint. Leave empty to generate
      and remember one; the manifest URL is printed in the app log at startup.
  positive_hours:
    name: Positive result lifetime (hours)
    description: How long a cached-stream confirmation remains valid. Availability can change afterward.
  negative_hours:
    name: Negative result lifetime (hours)
    description: How long an explicit negative result is retained. Errors and unexplained empty responses are retried as unknown.
  max_candidates_per_category:
    name: Catalogue depth
    description: >-
      How deep each catalogue is indexed. Larger values give broader coverage
      and take longer to complete. Search only covers what is indexed.
  max_episodes_per_series:
    name: Progressive episode batch size
    description: >-
      Checks scheduled per show before moving on. All aired candidates remain
      eligible; this is not a permanent episode limit. Only confirmed episodes
      are exposed.
  workers:
    name: Concurrent checks
    description: >-
      Parallel availability checks. All workers share the requests-per-minute
      budget and pause together after upstream rate limits.
  metadata_workers:
    name: Concurrent metadata fetches
    description: >-
      Parallel episode-list fetches. Long-running shows return very large lists,
      so a few workers keep series from queueing behind them.
  check_delay_seconds:
    name: Delay between checks (seconds)
    description: >-
      Additional pause each worker takes between checks. Lower values do not
      bypass the shared requests-per-minute budget.
  stream_requests_per_minute:
    name: Shared stream requests per minute
    description: >-
      Total request budget across all check workers. Default 30. Keep below the
      effective AIOStreams limit, leaving headroom for playback and other clients.
  scanner_instance_id:
    name: AIOStreams add-on instance ID
    description: >-
      The instanceId used when this app is added as a custom add-on in
      AIOStreams. Used to avoid indexing its own catalogues.

network:
  8097/tcp: Stremio metadata API for AIOStreams (token-protected)
