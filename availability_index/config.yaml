name: Cached Media Library
version: "0.8.1"
slug: availability_index
description: Verified cached discovery and search for AIOStreams; read-only, never proxies video
arch: [amd64, aarch64]
init: false
backup: cold
ingress: true
ingress_port: 8097
panel_icon: mdi:movie-check
ports:
  8097/tcp: 8097
ports_description:
  8097/tcp: Stremio metadata API for AIOStreams (token-protected)
options:
  aiostreams_url: http://192.168.0.13:3000
  active_uuid: ""
  active_password: ""
  stremio_uuid: ""
  stremio_encrypted_password: ""
  catalog_uuid: ""
  catalog_encrypted_password: ""
  endpoint_token: ""
  positive_hours: 12
  negative_hours: 24
  max_candidates_per_category: 250
  catalog_refresh_hours: 6
  catalog_revision: ""
  max_episodes_per_series: 12
  workers: 2
  metadata_workers: 3
  check_delay_seconds: 1.5
  stream_requests_per_minute: 30
  scanner_instance_id: cachedlibrary
  recovery_snapshot: ""
  tmdb_api_key: ""
  tmdb_language: en-US
  tmdb_catalogs: "[]"
schema:
  aiostreams_url: url
  active_uuid: str
  active_password: password
  stremio_uuid: str
  stremio_encrypted_password: password
  catalog_uuid: str
  catalog_encrypted_password: password
  endpoint_token: password
  positive_hours: int(1,48)
  negative_hours: int(1,168)
  max_candidates_per_category: int(20,5000)
  catalog_refresh_hours: int(1,48)
  catalog_revision: str?
  max_episodes_per_series: int(1,100)
  workers: int(1,6)
  metadata_workers: int(1,6)
  check_delay_seconds: float(0,10)
  stream_requests_per_minute: int(1,600)
  scanner_instance_id: str(1,32)
  recovery_snapshot: password?
  tmdb_api_key: password?
  tmdb_language: str?
  tmdb_catalogs: str?
